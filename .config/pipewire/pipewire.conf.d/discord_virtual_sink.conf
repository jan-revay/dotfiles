{
  "context": {
    "modules": [
      {
        "name": "libpipewire-module-loopback",

        "args": {
          "node.description": "Discord_virt_sink",

          "capture.props": {
            "audio.position": ["FL", "FR"],
            "media.class": "Audio/Sink",
            "node.name": "Discord_virtual_sink"
          },

          "playback.props": {
            "stream.dont-remix": true,
            "audio.position": ["FL", "FR"],
            "node.dont-reconnect": true,
            "node.name": "Discord_out",
            "node.passive": true,
            "target.object": "YOUR_ACTUAL_SINK_NAME"
          }

        }
      }
    ]
  }
}
